services:
  db_agencia:
    image: postgres:15
    container_name: agencia_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: agencia_user
      POSTGRES_PASSWORD: agencia_password123
      POSTGRES_DB: agencia_db
    ports:
      - "5435:5432"
    volumes:
      - ./pgdata:/var/lib/postgresql/data
